name: CI Workflow

# Executes on pushes to main branch and on pull requests
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Execute Python code linting
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - uses: actions/checkout@v7  

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: application/config/requirements.txt

      - name: Install dependencies
        working-directory: application
        run: pip install -r config/requirements.txt

      - name: Lint
        working-directory: application
        run: flake8 --config=config/flake8-config.txt app.py

  # Execute tests using pytest
  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 1

    # Use two different python versions for testing )
    strategy:
      fail-fast: true
      matrix:
        python-version: [3.12, 3.14]

    # Install and configure services for testing (postgresql)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: counter_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d counter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/counter_test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: application/config/requirements.txt

      - name: Install dependencies
        working-directory: application
        run: pip install -r config/requirements.txt

      - name: Run tests
        working-directory: application
        run: |
          mkdir -p reports
          pytest -v app.py \
            --junitxml="reports/junit-${{ matrix.python-version }}.xml" \
            --cov=app \
            --cov-report="xml:reports/coverage-${{ matrix.python-version }}.xml"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: application/reports/*.xml

  # Build the application image
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - uses: actions/checkout@v7

      - name: Build and start services
        working-directory: application
        run: docker compose up --build --detach --wait --wait-timeout 45

      - name: Verify application
        working-directory: application
        run: |
          curl --fail --silent --show-error http://localhost:5000/health
          curl --fail --silent --show-error http://localhost:5000/ | grep -q 'Compteur'

      - name: Stop services
        if: always()
        working-directory: application
        run: docker compose down --volumes

  # CI status check
  ci-ok:
    name: Ci-ok
    if: always()
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 1

    # Download test reports and verify CI results
    steps:
      - name: Download test reports
        if: always()
        uses: actions/download-artifact@v8
        with:
          pattern: test-reports-python-*
          merge-multiple: true
          path: test-reports
        continue-on-error: true

      - name: Verify CI results and reports
        if: always()
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" || \
                "$TEST_RESULT" != "success" || \
                "$BUILD_RESULT" != "success" ]]; then
            echo "CI jobs: lint=$LINT_RESULT test=$TEST_RESULT build=$BUILD_RESULT"
            exit 1
          fi
          report_count=$(find test-reports -type f -name '*.xml' | wc -l)
          if [[ "$report_count" -lt 4 ]]; then
            echo "Expected JUnit and coverage reports for both Python versions"
            exit 1
          fi
