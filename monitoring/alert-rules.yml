groups:
  - name: counter-app
    rules:
      # Seuil 5% : au-dela l'erreur n'est plus marginale pour les utilisateurs.
      # for 2m : deux evaluations consecutives, evite les pics isoles au deploiement.
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{code=~"5.."}[5m]))
            /
          clamp_min(sum(rate(http_requests_total[5m])), 0.0001)
            > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Taux d'erreurs 5xx eleve"
          description: "{{ $value | humanizePercentage }} des requetes sont en erreur serveur."

      # Seuil 500ms sur le p95 : degradation perceptible pour 5% des requetes.
      # for 5m : latence plus bruitee que les erreurs, on attend une tendance stable.
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(request_duration_seconds_bucket[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latence p95 superieure a 500ms"
          description: "p95 a {{ $value | printf \"%.3f\" }}s sur les 5 dernieres minutes."
